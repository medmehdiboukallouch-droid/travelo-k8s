# Test du LimitRange : ce Pod demande plus que le maximum autorisé
# par conteneur (1 CPU / 1Gi) -> Kubernetes doit le REFUSER.
apiVersion: v1
kind: Pod
metadata:
  name: quota-test
  namespace: travelo
spec:
  containers:
    - name: trop-gros
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: "2", memory: 2Gi }
        limits:   { cpu: "2", memory: 2Gi }
