# ---------------------------------------------------------------
# Ingress (contrôleur NGINX) : un seul nom de domaine travelo.local
#   http://travelo.local/      -> frontend
#   http://travelo.local/api/  -> backend
# Même origine pour le front et l'API : pas de problème CORS.
# ---------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelo-ingress
  namespace: travelo
  labels:
    app.kubernetes.io/part-of: travelo
spec:
  ingressClassName: nginx
  rules:
    - host: travelo.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: travelo-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: travelo-frontend
                port:
                  number: 80
