# ---------------------------------------------------------------
# Identifiants MySQL (stockés encodés en base64 par Kubernetes).
# NB : en production on ne versionne pas ce fichier en clair
#      (Sealed Secrets, External Secrets, Vault...).
# ---------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: travelo-db-secret
  namespace: travelo
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "Root-Travelo-2026"
  MYSQL_USER: "travelo"
  MYSQL_PASSWORD: "App-Travelo-2026"
